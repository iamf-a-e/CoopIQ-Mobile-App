<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CoopIQ: poultry and livestock health app. A photo in. A diagnosis out.">
  <meta name="theme-color" content="#1a2420">

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn link previews) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CoopIQ">
  <meta property="og:url" content="https://coopiq-mobile-app.vercel.app/">
  <meta property="og:title" content="CoopIQ">
  <meta property="og:description" content="Poultry and livestock health app. A photo in. A diagnosis out.">
  <meta property="og:image" content="https://coopiq-mobile-app.vercel.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="CoopIQ logo">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CoopIQ">
  <meta name="twitter:description" content="Poultry and livestock health app. A photo in. A diagnosis out.">
  <meta name="twitter:image" content="https://coopiq-mobile-app.vercel.app/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CoopIQ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CoopIQ</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a2420;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a2420;
      color: #9aa5a0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 1;
      transition: opacity 0.3s ease;
    }
    #splash img {
      width: 96px;
      height: 96px;
    }
    #splash p {
      margin-top: 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- Splash shown while Flutter loads (also what Vercel's preview screenshot captures) -->
  <div id="splash">
    <img src="icons/Icon-192.png" alt="CoopIQ">
    <p>A photo in. A diagnosis out.</p>
  </div>

  <script>
    function removeSplash() {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    // Safety net in case the event does not fire
    setTimeout(removeSplash, 15000);
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
