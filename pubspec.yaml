name: CoopIQ
description: CoopIQ, poultry and livestock health intelligence.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/poultry_rag.jsonl
    - assets/images/
    - assets/videos/

flutter_launcher_icons:
  image_path: "assets/images/logo2.png"
  web:
    generate: true
    image_path: "assets/images/logo2.png"
    background_color: "#1a2420"
    theme_color: "#1a2420"
